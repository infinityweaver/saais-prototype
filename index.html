<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAAIS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* VSU Brand Book web colors */
    --vsu-dark-green: #17321A;
    --vsu-green: #146939;
    --vsu-light-green: #00954F;
    --vsu-golden-yellow: #FDC530;
    --vsu-corn-yellow: #FCD83D;
    --vsu-yellow: #FFE800;

    --bg: #F5F7F5;
    --surface: #FFFFFF;
    --text: #1C241D;
    --muted: #5B6B5E;
    --border: #DCE3DD;
    --red: #B42318;
    --red-bg: #FDECEA;
    --amber: #8A5A00;
    --amber-bg: #FFF4D6;
    --blue: #1D4E89;
    --blue-bg: #E6EEF8;
    --green-bg: #E3F4EA;
    --gray-bg: #EEF0EE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Roboto, Arial, sans-serif; color: var(--text); background: var(--bg); font-size: 15px; line-height: 1.45; }
  h1, h2, h3, .brand { font-family: Montserrat, Arial, sans-serif; font-weight: 600; }
  h1 { font-size: 1.45rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  h3 { font-size: 0.98rem; margin: 0; }
  a { color: var(--vsu-green); }
  button, select, input, textarea { font: inherit; }

  .proto-bar { background: var(--vsu-golden-yellow); color: var(--vsu-dark-green); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
  .proto-bar strong { font-family: Montserrat, Arial, sans-serif; }
  .proto-bar select { padding: 3px 6px; border: 1px solid var(--vsu-dark-green); border-radius: 6px; background: #fff; }

  header.app { background: var(--vsu-dark-green); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; position: sticky; top: 0; z-index: 20; }
  .logo-ph { width: 34px; height: 34px; border: 1.5px dashed var(--vsu-golden-yellow); border-radius: 6px; display: grid; place-items: center; font-size: 9px; color: var(--vsu-golden-yellow); text-align: center; line-height: 1; flex: none; }
  .brand { font-size: 1.05rem; line-height: 1.1; }
  .brand small { display: block; font-family: Roboto, Arial, sans-serif; font-weight: 400; font-size: 11px; color: #CFE3D3; }
  header.app .spacer { flex: 1; }
  .icon-btn { background: transparent; border: 0; color: #fff; cursor: pointer; position: relative; padding: 6px; border-radius: 6px; }
  .icon-btn:hover { background: rgba(255,255,255,.1); }
  .badge-count { position: absolute; top: 0; right: 0; background: var(--vsu-golden-yellow); color: var(--vsu-dark-green); font-size: 10px; font-weight: 700; border-radius: 10px; padding: 0 5px; }
  .user-chip { font-size: 13px; text-align: right; line-height: 1.2; }
  .user-chip small { color: #CFE3D3; display: block; }
  #menuBtn { display: none; }

  .shell { display: flex; min-height: calc(100vh - 90px); }
  nav.side { width: 240px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 0; }
  nav.side .group { font-family: Montserrat, Arial, sans-serif; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 18px 4px; }
  nav.side a { display: block; padding: 8px 18px; color: var(--text); text-decoration: none; border-left: 3px solid transparent; }
  nav.side a:hover { background: var(--bg); }
  nav.side a.active { border-left-color: var(--vsu-golden-yellow); background: var(--green-bg); color: var(--vsu-dark-green); font-weight: 500; }
  main { flex: 1; min-width: 0; padding: 20px 24px 48px; }
  .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 16px; }
  .sub { color: var(--muted); font-size: 13.5px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; border-top: 3px solid var(--vsu-green); }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-family: Montserrat, Arial, sans-serif; font-size: 1.35rem; font-weight: 600; }
  .stat.warn { border-top-color: var(--vsu-golden-yellow); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--vsu-green); background: var(--vsu-green); color: #fff; cursor: pointer; font-weight: 500; text-decoration: none; }
  .btn:hover { background: var(--vsu-dark-green); }
  .btn.secondary { background: #fff; color: var(--vsu-green); }
  .btn.secondary:hover { background: var(--green-bg); }
  .btn.danger { background: #fff; color: var(--red); border-color: var(--red); }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .03em; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--bg); }
  .num { text-align: right; white-space: nowrap; }
  .code { font-weight: 500; white-space: nowrap; }

  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.passed { background: var(--green-bg); color: var(--vsu-green); }
  .chip.failed { background: var(--red-bg); color: var(--red); }
  .chip.inc { background: var(--amber-bg); color: var(--amber); }
  .chip.dropped, .chip.notcredited { background: var(--gray-bg); color: var(--muted); }
  .chip.ongoing { background: var(--blue-bg); color: var(--blue); }
  .chip.nottaken { background: #fff; color: var(--muted); border: 1px solid var(--border); }
  .chip.open { background: var(--amber-bg); color: var(--amber); }
  .chip.gold { background: var(--vsu-corn-yellow); color: var(--vsu-dark-green); }

  details.sem { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  details.sem summary { cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; gap: 8px; align-items: center; list-style: none; }
  details.sem summary::-webkit-details-marker { display: none; }
  details.sem summary::before { content: "▸"; color: var(--vsu-green); margin-right: 6px; }
  details.sem[open] summary::before { content: "▾"; }
  details.sem summary .t { flex: 1; font-family: Montserrat, Arial, sans-serif; font-weight: 600; }
  details.sem .body { border-top: 1px solid var(--border); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
  .tabs a { padding: 8px 14px; text-decoration: none; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs a.active { color: var(--vsu-dark-green); border-bottom-color: var(--vsu-golden-yellow); font-weight: 500; }

  label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .input, select.input, textarea.input { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: #fff; }
  .input.invalid { border-color: var(--red); background: var(--red-bg); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .err { font-size: 12.5px; color: var(--red); }
  .notice { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .notice.warn { background: var(--amber-bg); color: var(--amber); }
  .notice.info { background: var(--blue-bg); color: var(--blue); }
  .notice.ok { background: var(--green-bg); color: var(--vsu-green); }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); }
  .bar { height: 14px; background: var(--vsu-green); border-radius: 3px; }
  .bar.gold { background: var(--vsu-golden-yellow); }

  .modal-bg { position: fixed; inset: 0; background: rgba(23,50,26,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; }
  .modal .close { float: right; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--vsu-dark-green); color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 60; }

  .signin { max-width: 380px; margin: 8vh auto; text-align: center; }
  .signin .logo-ph { width: 72px; height: 72px; margin: 0 auto 12px; border-color: var(--vsu-green); color: var(--vsu-green); font-size: 11px; }
  .gbtn { display: inline-flex; gap: 10px; align-items: center; border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; background: #fff; cursor: pointer; font-weight: 500; }

  /* Phones: sidebar becomes a slide-down menu, tables become cards */
  @media (max-width: 760px) {
    #menuBtn { display: inline-block; }
    .user-chip { display: none; }
    nav.side { position: fixed; top: 90px; left: 0; right: 0; bottom: 0; width: auto; z-index: 30; display: none; overflow: auto; }
    nav.side.open { display: block; }
    main { padding: 16px 16px 40px; }
    table.stack thead { display: none; }
    table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
    table.stack tr { border-bottom: 1px solid var(--border); padding: 8px 0; }
    table.stack td { border: 0; padding: 2px 12px; }
    table.stack td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
    table.stack td:nth-child(-n+2)::before { content: none; }
    table.stack td:first-child { font-weight: 500; }
    table.stack td.num { text-align: left; }
  }

  /* PDF preview: an A4 sheet (794 x 1123 px at 96 dpi) scaled to fit the screen */
  .pdf-bg { position: fixed; inset: 0; background: #59625B; z-index: 70; overflow: auto; display: none; padding: 0 16px 32px; }
  .pdf-bg.show { display: block; }
  .pdf-bar { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 0; color: #fff; background: #59625B; z-index: 1; }
  .sheet-wrap { margin: 0 auto 16px; width: calc(794px * var(--s, 1)); height: calc(1123px * var(--s, 1)); }
  .sheet { width: 794px; height: 1123px; background: #fff; color: #111; transform: scale(var(--s, 1)); transform-origin: top left; padding: 34px 40px 26px; display: flex; flex-direction: column; font-family: Roboto, Arial, sans-serif; font-size: 8.6px; line-height: 1.3; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .sheet { position: relative; overflow: hidden; }
  .sheet > * { position: relative; }
  .sheet .wm { position: absolute; left: -150px; bottom: 60px; width: 560px; height: 560px; }
  .sheet .img { border: 1px dashed #9DB3A2; color: #6F8574; font-size: 7px; display: grid; place-items: center; text-align: center; line-height: 1.15; padding: 2px; flex: none; }
  .sheet .img.round { border-radius: 50%; }
  /* Letterhead: Bagong Pilipinas, VSU logo, green divider, office name (as on the DCST minutes and FC memos) */
  .sheet .lh { display: flex; align-items: center; gap: 10px; padding: 4px 0 4px 26px; }
  .sheet .lh .bar { width: 2px; height: 56px; background: var(--vsu-green); margin: 0 4px; }
  .sheet .lh .off { font-family: Montserrat, Arial, sans-serif; color: var(--vsu-green); }
  .sheet .lh .op { font-size: 13px; font-weight: 500; line-height: 1.1; }
  .sheet .lh .on { font-size: 19px; font-weight: 700; line-height: 1.05; }
  .sheet .dt { font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 12px; text-align: center; margin: 10px 0 6px; letter-spacing: .04em; }
  .sheet .cont { font-size: 8px; color: #555; margin-bottom: 6px; }
  .sheet .meta { font-size: 7.2px; color: #555; margin-top: 6px; }
  .sheet .pf { display: flex; align-items: center; gap: 10px; padding-top: 6px; font-size: 7.4px; color: #222; }
  .sheet .pf .contact { flex: 1; line-height: 1.25; }
  .sheet .pf .ctl { width: 92px; text-align: center; font-style: italic; font-size: 7.6px; align-self: flex-end; }
  .sheet .f2 .vm { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; line-height: 1.25; }
  .sheet .info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 14px; margin-bottom: 6px; }
  .sheet .info b { font-weight: 500; }
  .sheet .sumrow { display: flex; flex-wrap: wrap; gap: 4px 14px; background: #F1F6F2; border: 1px solid #CFDCD2; padding: 4px 8px; margin-bottom: 7px; }
  .sheet .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; align-content: start; }
  .sheet table { border-collapse: collapse; width: 100%; }
  .sheet th, .sheet td { border: 0.6px solid #B9C4BB; padding: 1.5px 3px; text-align: left; font-size: 8.2px; text-transform: none; letter-spacing: 0; color: #111; }
  .sheet th { background: #E6EFE8; font-weight: 500; }
  .sheet td:first-child { white-space: nowrap; }
  .sheet .slot-h { background: var(--vsu-dark-green); color: #fff; padding: 2px 4px; display: flex; justify-content: space-between; gap: 6px; font-weight: 500; }
  .sheet .n { text-align: right; white-space: nowrap; }
  .sheet .body { flex: 1; }
  .sheet .sig { display: flex; justify-content: space-around; margin: 10px 0 8px; text-align: center; }
  .sheet .sig > div { width: 38%; }
  .sheet .sig .line { border-top: 0.8px solid #111; margin-top: 22px; padding-top: 2px; font-weight: 500; }
</style>
</head>

// ---------- Rules (mirrors docs/02-requirements/01-program-checklist.md) ----------
const NUM = v => /^\d\.\d\d$/.test(v);
const effective = a => a.comp || a.fin;
const isPass = g => NUM(g) ? parseFloat(g) <= 3 : g === "S";

function courseStatus(code) {
  const atts = ATTEMPTS.filter(a => a.code === code);
  if (!atts.length) return { key: "nottaken", label: "Not yet taken", atts };
  const passed = [...atts].reverse().find(a => isPass(effective(a)));
  if (passed) return { key: "passed", label: "Passed", grade: effective(passed), atts };
  const last = atts[atts.length - 1], g = effective(last);
  if (!g) return { key: "ongoing", label: "Ongoing", grade: last.mid ? "mid " + last.mid : "", atts };
  if (g === "INC") return { key: "inc", label: "INC", grade: g, atts };
  if (g === "DR") return { key: "dropped", label: "Dropped", grade: g, atts };
  if (g === "NA") return { key: "failed", label: "Not attending", grade: g, atts };
  return { key: "failed", label: "Failed", grade: g, atts };
}

// GWA over a set of curriculum courses (one year-and-semester slot, or the whole curriculum)
function gwaOf(courses) {
  const thesisUnits = CURR.filter(c => c.thesis).reduce((s, c) => s + c.units, 0);
  let sum = 0, units = 0;
  for (const c of courses) {
    if (c.cat === "NSTP") continue;
    const st = courseStatus(c.code);
    const latest = st.atts.length ? effective(st.atts[st.atts.length - 1]) : "";
    if (NUM(latest)) { const u = c.thesis ? thesisUnits : c.units; sum += parseFloat(latest) * u; units += u; }
  }
  return units ? (sum / units).toFixed(2) : "—";
}

function summary() {
  let earned = 0, total = 0, sum = 0, units = 0;
  const thesisUnits = CURR.filter(c => c.thesis).reduce((s, c) => s + c.units, 0);
  for (const c of CURR) {
    total += c.units;
    const st = courseStatus(c.code);
    if (st.key === "passed") earned += c.units;
    if (c.cat === "NSTP") continue;
    const latest = st.atts.length ? effective(st.atts[st.atts.length - 1]) : "";
    if (NUM(latest)) { const u = c.thesis ? thesisUnits : c.units; sum += parseFloat(latest) * u; units += u; }
  }
  // Year standing: highest N where earned >= units of years 1..N-1
  let standing = 1;
  for (let n = 2; n <= 4; n++) {
    const need = CURR.filter(c => c.year < n).reduce((s, c) => s + c.units, 0);
    if (earned >= need) standing = n;
  }
  const deficiencies = CURR.filter(c => {
    const k = courseStatus(c.code).key;
    return (k === "failed" || k === "inc" || k === "dropped") || (k === "nottaken" && c.year < 3);
  });
  return { earned, total, gwa: units ? (sum / units).toFixed(2) : "—", standing, deficiencies };
}

// ---------- Rendering helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chip = (key, label) => `<span class="chip ${key}">${esc(label)}</span>`;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600); }
function openModal(html) { $("#modal").innerHTML = `<button class="btn secondary small close" onclick="closeModal()">Close</button>` + html; $("#modalBg").classList.add("show"); }
function closeModal() { $("#modalBg").classList.remove("show"); }
$("#modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeModal(); });

function table(headers, rows, opts = {}) {
  return `<table class="stack"><thead><tr>${headers.map(h => `<th class="${h.endsWith("#") ? "num" : ""}">${esc(h.replace(/#$/, ""))}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr ${r.onclick ? `class="clickable" onclick="${r.onclick}"` : ""}>${r.cells.map((c, i) => `<td data-l="${esc(headers[i].replace(/#$/, ""))}" class="${headers[i].endsWith("#") ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")
  }</tbody></table>`;
}

function checklistPdf() {
  const sm = summary(), groups = [];
  for (const c of CURR) { const k = c.year + "-" + c.term; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, year: c.year, term: c.term, courses: [] }); g.courses.push(c); }
  const slot = g => {
    const units = g.courses.reduce((s, c) => s + c.units, 0), done = g.courses.filter(c => courseStatus(c.code).key === "passed").length;
    return `<div><div class="slot-h"><span>${YEAR_LABEL[g.year]} · ${TERM_LABEL[g.term]}</span><span>${done}/${g.courses.length} passed · ${units} u · GWA ${gwaOf(g.courses)}</span></div>
      <table><thead><tr><th>Course</th><th>Descriptive title</th><th class="n">Units</th><th class="n">Grade</th><th>Remarks</th></tr></thead><tbody>${g.courses.map(c => {
        const st = courseStatus(c.code), taken = st.atts.find(a => a.takenAs);
        const earlier = st.atts.slice(0, -1).map(a => `${effective(a)} (${TERM_LABEL[a.term].replace("Semester", "Sem")} ${a.sy})`);
        const rem = [st.key === "passed" || st.key === "nottaken" ? "" : st.label, taken ? "as " + taken.takenAs.split(" ").slice(0, 2).join(" ") : "", earlier.length ? "earlier: " + earlier.join("; ") : "", st.atts.some(a => a.comp) ? "INC completed" : ""].filter(Boolean).join(" · ");
        return `<tr><td>${esc(c.code)}</td><td>${esc(c.title)}</td><td class="n">${c.units}</td><td class="n">${esc(st.key === "ongoing" ? "" : st.grade || "")}</td><td>${esc(rem)}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  };
  const body = `
    <div class="info"><div><b>Name:</b> REYES, Ana</div><div><b>Student no.:</b> 23-1-01234</div><div><b>Program:</b> BS Computer Science</div>
      <div><b>Curriculum:</b> ${CURRICULUM_NAME}</div><div><b>Adviser:</b> Prof. Mara Reyes</div><div><b>Year standing:</b> ${YEAR_LABEL[sm.standing]}</div></div>
    <div class="sumrow"><span><b>Units earned:</b> ${sm.earned} of ${sm.total}</span><span><b>Remaining:</b> ${sm.total - sm.earned}</span><span><b>GWA:</b> ${sm.gwa}</span><span><b>Deficiencies:</b> ${sm.deficiencies.map(c => c.code).join(", ") || "none"}</span></div>
    <div class="grid2">${groups.filter(g => g.year <= 3).map(slot).join("")}</div>`;
  const body2 = `
    <div class="cont">REYES, Ana · 23-1-01234 · Program checklist (continued)</div>
    <div class="grid2">${groups.filter(g => g.year > 3).map(slot).join("")}</div>
    <div class="sig"><div><div class="line">Prof. Mara Reyes</div>Prepared by: Academic Adviser</div><div><div class="line">Dr. Leo Santos</div>Noted by: Department Head</div></div>`;
  return sheet("PROGRAM CHECKLIST", [body, body2]);
}

  }
  const r = ROLES[role], cur = screen && S[screen] ? screen : DEFAULT[role][1];
  if (!r.groups.includes(acting)) acting = DEFAULT[role][0];
  const nav = r.groups.map(g => `<div class="group">${NAV[g].label}</div>` + NAV[g].items.map(([k, l]) => `<a href="#/${k}" data-g="${g}" class="${k === cur && g === acting ? "active" : ""}">${l}</a>`).join("")).join("");
  $("#app").innerHTML = `
    <header class="app">
      <button class="icon-btn" id="menuBtn" aria-label="Menu" onclick="document.querySelector('nav.side').classList.toggle('open')">☰</button>
      <div class="logo-ph">VSU logo</div>
      <div class="brand">SAAIS<small>Student Academic Advising · DCST</small></div>
      <div class="spacer"></div>
      <a class="icon-btn" href="#/notifications" aria-label="Notifications">🔔<span class="badge-count">3</span></a>
      <div class="user-chip">${esc(r.name)}<small>${esc(r.sub)}</small></div>
      <button class="icon-btn" onclick="setRole('signin')" style="font-size:13px">Sign out</button>
    </header>
    <div class="shell"><nav class="side">${nav}</nav><main>${S[cur]({ role: acting, tab, viewer: role === "student" ? "student" : "adviser" })}</main></div>`;
}
window.go = s => { route = s; try { history.replaceState(null, "", "#/" + s); } catch (e) {} render(); window.scrollTo(0, 0); };
window.setRole = r => { role = r; $("#roleSel").value = r; if (r !== "signin") acting = DEFAULT[r][0]; go(r === "signin" ? "" : DEFAULT[r][1]); };
$("#roleSel").addEventListener("change", e => setRole(e.target.value));
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  if (a.dataset.g) acting = a.dataset.g;
  go(a.getAttribute("href").slice(2));
});
window.addEventListener("hashchange", () => { route = location.hash.replace(/^#\/?/, ""); render(); });
render();
</script>
</body>
</html>
